# This workflow will install Python dependencies, run tests and lint with supported Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: snnTorch CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.html'
      - '**/*.rst'
      - '**/*.gif'
      - '**/*.png'
      - '**/*.ipynb'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.editorconfig'
      - '.flake8'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.html'
      - '**/*.rst'
      - '**/*.gif'
      - '**/*.png'
      - '**/*.ipynb'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.editorconfig'
      - '.flake8'
      - '.gitignore'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Test with tox
      run: tox

    #   run: |
